<!DOCTYPE html>
<html>
<head>
    <title>Add Medicine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding-top: 40px;
        }

        .box {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 95%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>💊 Add Medicine</h2>

    <form action="/addMedicine" method="POST">

        <input type="text" name="medName" placeholder="Medicine Name" required>
    
        <input type="text" name="batchNo" placeholder="Batch Number" required>
    
        <input type="number" name="quantity" placeholder="Quantity" required>
    
        <input type="date" name="expiryDate" required>
    
        <input type="number" name="buyPrice" placeholder="Buy Price" required>
    
        <input type="number" name="sellPrice" placeholder="Sell Price" required>
    
        <button type="submit">Save Medicine</button>
    
    </form>

</div>

</body>
</html>
