<!DOCTYPE html>
<html>
<head>
    <title>MedTrack LK Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <style>
        body {
            font-family: Arial;
            background: #f2f6ff;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: space-around;
            margin-top: 40px;
        }

        .card {
            background: white;
            padding: 20px;
            width: 200px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #ccc;
            text-align: center;
        }

        .card a {
            text-decoration: none;
            display: block;
            margin-top: 10px;
            color: blue;
        }
        
@media (max-width: 600px) {

    body {
        font-size: 14px;
    }

    h1, h2, h3 {
        text-align: center;
    }

    a {
        display: block;
        margin: 10px 0;
    }

    .box {
        width: 90% !important;
    }

}

button {
    padding: 10px;
    margin: 5px;
    width: auto;
}

@media (max-width: 600px) {
    button {
        width: 100%;
    }

    input {
        width: 100%;
    }
}

    </style>
</head>

<body>

<h1>💊 MedTrack LK Dashboard</h1>
<h2 style="text-align:center;">Welcome Admin 👨‍⚕️</h2>
<div style="
    display:flex;
    justify-content:space-around;
    flex-wrap:wrap;
    gap:10px;
    margin-top:20px;
">
    

    <div style="margin:20px;">
        <a href="/viewMedicines.html">📦 Inventory</a><br><br>
        <a href="/billing.html">💰 Billing</a><br><br>
        <a href="/chatbot.html">🤖 AI Chatbot</a><br><br>
    </div>
</div>
<div style="display:flex;justify-content:space-around;flex-wrap:wrap;margin-top:30px;">

    <div style="
    background:white;
    padding:20px;
    width:200px;
    max-width:90%;
    border-radius:10px;
    box-shadow:0 0 10px #ccc;
    text-align:center;
">
        <h3>📦 Medicines</h3>
        <h2 id="m1">0</h2>
    </div>

    <div style="
    background:white;
    padding:20px;
    width:200px;
    max-width:90%;
    border-radius:10px;
    box-shadow:0 0 10px #ccc;
    text-align:center;
">
        <h3>💰 Sales</h3>
        <h2 id="m2">0</h2>
    </div>

    <div style="
    background:white;
    padding:20px;
    width:200px;
    max-width:90%;
    border-radius:10px;
    box-shadow:0 0 10px #ccc;
    text-align:center;
">
        <h3>⚠ Low Stock</h3>
        <h2 id="m3">0</h2>
    </div>

    <div style="
    background:white;
    padding:20px;
    width:200px;
    max-width:90%;
    border-radius:10px;
    box-shadow:0 0 10px #ccc;
    text-align:center;
">>
        <h3>⏳ Expiring</h3>
        <h2 id="m4">0</h2>
    </div>

</div>
<div class="container">

    <div class="card">
        <h3>➕ Add Medicine</h3>
        <a href="/addMedicine.html">Open</a>
    </div>

    <div class="card">
        <h3>📦 View Medicines</h3>
        <a href="/viewMedicines.html">Open</a>
    </div>

    <div class="card">
        <h3>⚠️ Expiry Alerts</h3>
        <a href="/expiryAlerts.html">Open</a>
    </div>

    <div class="card">
        <h3>📉 Low Stock</h3>
        <a href="/lowStock.html">Open</a>
    </div>

</div>
<h2>📊 Sales Overview</h2>
<canvas id="salesChart" width="400" height="200"></canvas>
<script>
    fetch("/stats")
    .then(res => res.json())
    .then(data => {
    
        document.getElementById("m1").innerText = data.totalMedicines;
        document.getElementById("m2").innerText = data.totalSales;
        document.getElementById("m3").innerText = data.lowStock;
        document.getElementById("m4").innerText = data.expiring;
    
    });
    </script>
<script>

    fetch("/sales-summary")
    .then(res => res.json())
    .then(data => {
    
        const labels = data.map(item => item.medName);
        const values = data.map(item => item.totalQty);
    
        new Chart(document.getElementById("salesChart"), {
            type: "bar",
            data: {
                labels: labels,
                datasets: [{
                    label: "Medicines Sold",
                    data: values
                }]
            }
        });
    
    });
    
    </script>

</body>



</html>
